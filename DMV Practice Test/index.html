<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisconsin DMV Practice Tests</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #111827);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.quiz-container {
    background: #111827;
    padding: 30px;
    border-radius: 20px;
    width: 750px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}

/* ===== HOME PANEL GRID ===== */

.test-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.test-card {
    background: linear-gradient(145deg, #1f2937, #111827);
    border-radius: 18px;
    padding: 25px;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.test-status {
    font-size: 13px;
    color: #cbd5e1; /* light gray */
}

.test-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(37,99,235,0.4);
    border: 1px solid rgba(37,99,235,0.4);
}

.test-card h3 {
    margin: 0 0 10px 0;
}

.test-card p {
    font-size: 14px;
    opacity: 0.7;
    margin: 4px 0;
}

/* ===== QUIZ AREA ===== */

img {
    width: 200px;
    margin-bottom: 20px;
}

button {
    display: block;
    width: 100%;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 15px;
}

.answer-btn {
    background: #374151;
    color: white;
}

.answer-btn:hover {
    background: #4b5563;
}

.correct { background: #16a34a !important; }
.wrong { background: #dc2626 !important; }

.hidden { display: none; }

#nextBtn, #retryBtn, #menuBtn {
    background: #2563eb;
}
</style>
</head>
<body>

<div class="quiz-container" id="container"></div>

<script>

/* ================================
   TEST DATABASE
================================ */

const tests = {

"Street Signs Test": {
    type: "image",
    status: null,
    questions: [
        { image: "assets/images/street signs/two-way-traffic-sign.svg", answer: "Two way traffic" },
        { image: "assets/images/street signs/slow-vehicle-sign.svg", answer: "Slow vehicle" },
        { image: "assets/images/street signs/school-crossing-sign.svg", answer: "School crossing" },
        { image: "assets/images/street signs/pngs/no-passing-zone-sign.png", answer: "No passing zone" },
        { image: "assets/images/street signs/pedestrian-crossing-sign.svg", answer: "Pedestrian crossing" },
        { image: "assets/images/street signs/railroad-crossing-sign.svg", answer: "Railroad crossing" },
        { image: "assets/images/street signs/four-way-intersection-sign.svg", answer: "Four way intersection" },
        { image: "assets/images/street signs/pngs/lane-ends-sign.png", answer: "Lane ends" },
        { image: "assets/images/street signs/divided-highway-begins-sign.svg", answer: "Divided highway begins" },
        { image: "assets/images/street signs/pngs/yield-sign.png", answer: "Yield" },
        { image: "assets/images/street signs/pngs/stop-sign.png", answer: "Stop" },
        { image: "assets/images/street signs/no-u-turn-sign.svg", answer: "No U turn" },
        { image: "assets/images/street signs/pngs/do-not-enter-sign.png", answer: "Do not enter" },
        { image: "assets/images/street signs/flagger-sign.svg", answer: "Flagger" },
        { image: "assets/images/street signs/pngs/roadwork-ahead-sign.png", answer: "Roadwork ahead" }
    ]
},

"Wisconsin Basic DMV Test": {
    type: "text",
    status: null,
    questions: [
        {
            question: "What is the legal blood alcohol limit for drivers over 21 in Wisconsin?",
            options: ["0.08%", "0.10%", "0.05%", "0.02%"],
            answer: "0.08%"
        },
        {
            question: "What is the legal blood alcohol limit for drivers under 21 in Wisconsin?",
            options: ["0.08%", "0.05%", "0.02%", "Zero tolerance (0.00%)"],
            answer: "Zero tolerance (0.00%)"
        },
        {
            question: "When approaching a school bus with flashing red lights, you must:",
            options: ["Slow down only", "Stop until lights stop flashing", "Pass carefully", "Honk and continue"],
            answer: "Stop until lights stop flashing"
        },
        {
            question: "A solid yellow line on your side of the road means:",
            options: ["Passing is allowed", "No passing", "Road narrows", "Yield ahead"],
            answer: "No passing"
        },
        {
            question: "At a four-way stop, who has the right-of-way?",
            options: ["The vehicle on the left", "The fastest vehicle", "The first vehicle to stop", "The largest vehicle"],
            answer: "The first vehicle to stop"
        },
        {
            question: "What should you do at a flashing red traffic signal?",
            options: ["Slow down", "Stop completely", "Yield", "Proceed with caution"],
            answer: "Stop completely"
        },
        {
            question: "What does a flashing yellow traffic signal mean?",
            options: ["Stop", "Yield", "Proceed with caution", "Speed up"],
            answer: "Proceed with caution"
        },
        {
            question: "When must you signal before turning?",
            options: ["At least 100 feet before turning", "At least 50 feet before turning", "Only in traffic", "Only at intersections"],
            answer: "At least 100 feet before turning"
        },
        {
            question: "What is the speed limit in Wisconsin school zones when children are present?",
            options: ["15 mph", "20 mph", "25 mph", "30 mph"],
            answer: "15 mph"
        },
        {
            question: "What is the default speed limit on Wisconsin highways unless otherwise posted?",
            options: ["55 mph", "65 mph", "70 mph", "75 mph"],
            answer: "55 mph"
        },
        {
            question: "You must yield to pedestrians:",
            options: ["Only in crosswalks", "Only at stop signs", "At all intersections and crosswalks", "Only when signaled"],
            answer: "At all intersections and crosswalks"
        },
        {
            question: "When driving in fog, you should use:",
            options: ["High beams", "Parking lights", "Low beams", "Hazard lights only"],
            answer: "Low beams"
        },
        {
            question: "When are you required to use headlights?",
            options: ["Only at night", "From sunset to sunrise", "During rain only", "When tired"],
            answer: "From sunset to sunrise"
        },
        {
            question: "If you approach a stopped emergency vehicle with flashing lights, you must:",
            options: ["Maintain speed", "Stop completely", "Move over or slow down", "Honk"],
            answer: "Move over or slow down"
        },
        {
            question: "When passing a bicycle, you must allow at least:",
            options: ["1 foot", "2 feet", "3 feet", "5 feet"],
            answer: "3 feet"
        },
        {
            question: "If two vehicles arrive at an intersection at the same time, who goes first?",
            options: ["Vehicle on the right", "Vehicle on the left", "Vehicle going faster", "Larger vehicle"],
            answer: "Vehicle on the right"
        },
        {
            question: "What does a solid white line between lanes mean?",
            options: ["Lane changes discouraged", "Passing allowed", "Road ends", "No traffic"],
            answer: "Lane changes discouraged"
        },
        {
            question: "You must stop before crossing railroad tracks when:",
            options: ["Lights are flashing", "You see a train", "Gates are lowered", "All of the above"],
            answer: "All of the above"
        },
        {
            question: "When parking uphill with a curb, you should turn your wheels:",
            options: ["Toward the curb", "Away from the curb", "Straight", "It doesn’t matter"],
            answer: "Away from the curb"
        },
        {
            question: "What should you do if your vehicle begins to skid?",
            options: ["Brake hard", "Steer in the direction of the skid", "Accelerate", "Turn opposite direction"],
            answer: "Steer in the direction of the skid"
        },
        {
            question: "Wisconsin’s minimum following distance in good conditions is at least:",
            options: ["2 seconds", "3 seconds", "4 seconds", "5 seconds"],
            answer: "3 seconds"
        },
        {
            question: "You may turn right on red unless:",
            options: ["There is a sign prohibiting it", "Traffic is light", "You are late", "At night"],
            answer: "There is a sign prohibiting it"
        },
        {
            question: "When must you dim your high beams?",
            options: ["Within 500 feet of oncoming traffic", "Within 100 feet", "Never", "Only in cities"],
            answer: "Within 500 feet of oncoming traffic"
        },
        {
            question: "A broken yellow line means:",
            options: ["No passing", "Passing allowed when safe", "Yield ahead", "School zone"],
            answer: "Passing allowed when safe"
        },
        {
            question: "What does a triangular red and white sign mean?",
            options: ["Stop", "Yield", "No entry", "Warning"],
            answer: "Yield"
        },
        {
            question: "If you miss your exit on a freeway, you should:",
            options: ["Back up", "Make a U-turn", "Go to the next exit", "Stop"],
            answer: "Go to the next exit"
        },
        {
            question: "Drivers must wear seat belts:",
            options: ["Only on highways", "Only under 18", "At all times", "Only in cities"],
            answer: "At all times"
        },
        {
            question: "Children under age 8 must:",
            options: ["Sit in front seat", "Use proper child restraint", "Wear helmet", "Sit anywhere"],
            answer: "Use proper child restraint"
        },
        {
            question: "When driving in a work zone, fines for speeding are:",
            options: ["Reduced", "Doubled", "Optional", "Unchanged"],
            answer: "Doubled"
        },
        {
            question: "Hydroplaning is caused by:",
            options: ["Ice", "Wind", "Water on the road", "Oil only"],
            answer: "Water on the road"
        },
        {
            question: "If a traffic signal is dark at an intersection, you should:",
            options: ["Speed through", "Treat as a four-way stop", "Ignore it", "Yield only"],
            answer: "Treat as a four-way stop"
        },
        {
            question: "What does a red curb mean?",
            options: ["Loading zone", "No parking", "Short parking", "Bus stop"],
            answer: "No parking"
        },
        {
            question: "When driving behind a motorcycle, you should:",
            options: ["Follow closely", "Allow full lane width", "Pass immediately", "Honk often"],
            answer: "Allow full lane width"
        },
        {
            question: "You must stop for a pedestrian:",
            options: ["Only if signaled", "In marked crosswalks", "In any crosswalk", "Only at lights"],
            answer: "In any crosswalk"
        },
        {
            question: "If your tire blows out, you should:",
            options: ["Brake hard", "Grip wheel and slow gradually", "Turn sharply", "Accelerate"],
            answer: "Grip wheel and slow gradually"
        },
        {
            question: "Using a handheld phone while driving in Wisconsin is:",
            options: ["Allowed anytime", "Prohibited in work zones", "Required", "Encouraged"],
            answer: "Prohibited in work zones"
        },
        {
            question: "The minimum insurance required in Wisconsin includes:",
            options: ["Liability coverage", "Collision only", "Comprehensive only", "None"],
            answer: "Liability coverage"
        },
        {
            question: "When must you stop before turning right on red?",
            options: ["After turning", "Before the crosswalk or stop line", "Only if cars present", "Never"],
            answer: "Before the crosswalk or stop line"
        },
        {
            question: "What does a diamond-shaped sign indicate?",
            options: ["Regulatory", "Warning", "Guide", "School"],
            answer: "Warning"
        },
        {
            question: "If an officer signals you to drive through a red light, you should:",
            options: ["Ignore officer", "Obey traffic signal", "Follow officer’s directions", "Stop vehicle"],
            answer: "Follow officer’s directions"
        },
        {
            question: "A double solid yellow line means:",
            options: ["Passing allowed", "Passing not allowed", "Yield", "School zone"],
            answer: "Passing not allowed"
        },
        {
            question: "What should you do when approaching a roundabout?",
            options: ["Stop always", "Yield to traffic inside", "Speed up", "Honk"],
            answer: "Yield to traffic inside"
        },
        {
            question: "When backing up, you should:",
            options: ["Rely on mirrors only", "Turn body and look behind", "Speed up", "Use high beams"],
            answer: "Turn body and look behind"
        },
        {
            question: "If your accelerator sticks, you should:",
            options: ["Shift to neutral", "Turn engine off immediately", "Brake only", "Panic"],
            answer: "Shift to neutral"
        },
        {
            question: "On a multilane road, slower traffic should keep:",
            options: ["Left lane", "Right lane", "Middle lane", "Any lane"],
            answer: "Right lane"
        },
        {
            question: "Before changing lanes, you should:",
            options: ["Signal and check mirrors/blind spot", "Honk", "Brake hard", "Speed up"],
            answer: "Signal and check mirrors/blind spot"
        },
        {
            question: "If you see a yellow arrow while turning left, you should:",
            options: ["Stop immediately", "Yield to oncoming traffic", "Ignore it", "Accelerate"],
            answer: "Yield to oncoming traffic"
        },
        {
            question: "Drivers must yield to blind pedestrians when:",
            options: ["They have a white cane or guide dog", "Only at lights", "Only in cities", "Never"],
            answer: "They have a white cane or guide dog"
        },
        {
            question: "If involved in a crash with injury, you must:",
            options: ["Leave scene", "Exchange info and report", "Hide vehicle", "Drive away"],
            answer: "Exchange info and report"
        },
        {
            question: "When approaching a hill or curve with limited visibility, you should:",
            options: ["Pass quickly", "Stay in your lane and slow down", "Honk and speed", "Drive left"],
            answer: "Stay in your lane and slow down"
        }
    ]
}

};

// Load saved status if available
const savedStatus = localStorage.getItem('dmvTestStatus');
if (savedStatus) {
    const parsed = JSON.parse(savedStatus);
    Object.keys(parsed).forEach(testName => {
        if (tests[testName]) {
            tests[testName].status = parsed[testName].status;
        }
    });
}

/* ================================
   ENGINE VARIABLES
================================ */

let activeTest = null;
let questions = [];
let currentIndex = 0;
let score = 0;

const container = document.getElementById("container");

/* Fisher-Yates Shuffle */
function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

/* ================================
   MENU (Panel Cards)
================================ */

function showMenu() {
    container.innerHTML = `
        <h2>Wisconsin DMV Practice Tests</h2>
        <div class="test-grid" id="testGrid"></div>
    `;

    const grid = document.getElementById("testGrid");

    Object.keys(tests).forEach(testName => {
        const card = document.createElement("div");
        card.classList.add("test-card");

        const questionCount = tests[testName].questions.length;

        // Card content with status inside
        const statusText = tests[testName].status
            ? `${tests[testName].status.score}/${tests[testName].status.total} — ${tests[testName].status.passed ? "Passed" : "Failed"}`
            : "Not Completed";

        card.innerHTML = `
            <h3>${testName}</h3>
            <p>${questionCount} Questions</p>
            <p>${tests[testName].type === "image" ? "Street Sign Recognition" : "Written Knowledge Test"}</p>
            <p class="test-status" style="margin-top: 10px; text-align: center;">${statusText}</p>
        `;

        card.onclick = () => startQuiz(testName);
        grid.appendChild(card);
    });
}

/* ================================
   START QUIZ
================================ */

function startQuiz(testName) {
    activeTest = tests[testName];
    activeTestName = testName; // track the current test for results/status
    questions = shuffle([...activeTest.questions]);
    currentIndex = 0;
    score = 0;

    container.innerHTML = `
        <h2>${testName}</h2>
        <div id="questionArea"></div>
        <div id="answers"></div>
        <button id="nextBtn" class="hidden">Next Question</button>
        <div id="result" class="hidden"></div>
        <button id="retryBtn" class="hidden">Retry Test</button>
        <button id="menuBtn">Back to Menu</button>
    `;

    document.getElementById("menuBtn").onclick = showMenu;
    document.getElementById("retryBtn").onclick = () => startQuiz(testName);
    document.getElementById("nextBtn").onclick = nextQuestion;

    showQuestion();
}

/* ================================
   SHOW QUESTION
================================ */

function showQuestion() {
    const q = questions[currentIndex];
    const questionArea = document.getElementById("questionArea");
    const answersDiv = document.getElementById("answers");

    answersDiv.innerHTML = "";
    document.getElementById("nextBtn").classList.add("hidden");

    if (activeTest.type === "image") {
        questionArea.innerHTML = `<img src="${q.image}">`;

        const wrongOptions = shuffle(
            questions.filter(x => x.answer !== q.answer)
        ).slice(0, 3);

        const options = shuffle([q, ...wrongOptions]);

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.innerText = opt.answer;
            btn.classList.add("answer-btn");
            btn.onclick = () => selectAnswer(btn, opt.answer === q.answer);
            answersDiv.appendChild(btn);
        });

    } else {
        questionArea.innerHTML = `<p>${q.question}</p>`;
        const options = shuffle([...q.options]);

        options.forEach(opt => {
            const btn = document.createElement("button");
            btn.innerText = opt;
            btn.classList.add("answer-btn");
            btn.onclick = () => selectAnswer(btn, opt === q.answer);
            answersDiv.appendChild(btn);
        });
    }
}

/* ================================
   ANSWER HANDLING
================================ */

function selectAnswer(button, isCorrect) {
    const buttons = document.querySelectorAll(".answer-btn");
    buttons.forEach(btn => btn.disabled = true);

    if (isCorrect) {
        button.classList.add("correct");
        score++;
    } else {
        button.classList.add("wrong");
        buttons.forEach(btn => {
            if (btn.innerText === questions[currentIndex].answer) {
                btn.classList.add("correct");
            }
        });
    }

    document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

/* ================================
   RESULTS
================================ */

function showResults() {
    const percent = Math.round((score / questions.length) * 100);

    // Clear quiz area
    document.getElementById("questionArea").innerHTML = "";
    document.getElementById("answers").innerHTML = "";
    document.getElementById("nextBtn").classList.add("hidden");

    // Show result
    const resultDiv = document.getElementById("result");
    const passed = percent >= 80;

    resultDiv.innerHTML = `
        <h3>Your Score: ${percent}%</h3>
        <p>${passed ? "You Passed! 🎉" : "You Failed. Study and try again."}</p>
    `;

    resultDiv.classList.remove("hidden");
    document.getElementById("retryBtn").classList.remove("hidden");

    // ===== Update test status for menu =====
    tests[activeTestName].status = {
        score: score,
        total: questions.length,
        passed: passed
    };

    // ===== Save status to localStorage for persistence =====
    localStorage.setItem('dmvTestStatus', JSON.stringify(tests));
}

/* ================================
   INIT
================================ */

showMenu();

</script>

</body>
</html>
